[project]
name = "travel-recommender"
version = "0.0.1"
description = "CS-691 capstone: personalized multi-agent travel recommender"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api", "optimizer", "ingest", "ai", "ranker"]
