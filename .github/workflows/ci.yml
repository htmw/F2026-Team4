# CI — runs on every push and PR. This is what keeps `main` green: a red check
# blocks the merge, so nobody has to police the branch by hand.
#
# It does nothing until this file lands in the instructor's GitHub repo. Once it's
# there, turn on branch protection for `main` (see CONTRIBUTING.md) so a passing
# run of this workflow is required before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  web:
    name: Web (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: cd web && npm install
      - name: Typecheck
        run: cd web && npm run typecheck
      - name: Test
        run: cd web && npm run test
